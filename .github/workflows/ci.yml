name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install gfortran
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc

      - name: install fpm (linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /usr/local/bin/fpm \
            https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-linux-x86_64-gcc-12
          chmod +x /usr/local/bin/fpm

      - name: install fpm (macos)
        if: runner.os == 'macOS'
        run: |
          brew install fpm

      - name: install fpm (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -fsSL -o fpm.exe https://github.com/fortran-lang/fpm/releases/download/v0.13.0/fpm-0.13.0-windows-x86_64-gcc-12.exe
          Get-Location | Select-Object -ExpandProperty Path | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: build
        run: fpm build

      - name: build with strict warnings
        run: fpm build --flag "-Wall -Wextra -Wimplicit-interface"

      - name: test
        run: fpm test

      - name: test with strict warnings
        run: fpm test --flag "-Wall -Wextra -Wimplicit-interface"
